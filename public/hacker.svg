<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <!-- Soft Red Neon Glow -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Dark Fill -->
  <rect width="500" height="500" fill="#000000" />

  <!-- Outer Rounded Glowing Red Border matching image.png -->
  <rect 
    x="35" 
    y="35" 
    width="430" 
    height="430" 
    rx="36" 
    fill="#050508" 
    stroke="#ff1a2a" 
    stroke-width="2.5" 
    filter="url(#neonGlow)" 
  />

  <!-- Outer Crosshair Cardinal Ticks -->
  <line x1="250" y1="72" x2="250" y2="108" stroke="#ff1a2a" stroke-width="3" stroke-linecap="round" />
  <line x1="250" y1="392" x2="250" y2="428" stroke="#ff1a2a" stroke-width="3" stroke-linecap="round" />
  <line x1="72" y1="250" x2="108" y2="250" stroke="#ff1a2a" stroke-width="3" stroke-linecap="round" />
  <line x1="392" y1="250" x2="428" y2="250" stroke="#ff1a2a" stroke-width="3" stroke-linecap="round" />

  <!-- Dual Concentric Reticle Rings -->
  <circle cx="250" cy="250" r="160" stroke="#ff1a2a" stroke-width="3" fill="none" />
  <circle cx="250" cy="250" r="148" stroke="#ff1a2a" stroke-width="1.8" fill="none" />

  <!-- Center Teacup & Grinning Smile Art -->
  <g transform="translate(250, 236)" stroke="#ff1a2a" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Teacup rim ellipse -->
    <ellipse cx="0" cy="-45" rx="55" ry="11" stroke-width="2.5" fill="#050508" />

    <!-- Teacup body -->
    <path d="M -54 -44 C -56 5, -42 38, -13 43 L 13 43 C 42 38, 56 5, 54 -44" stroke-width="2.5" fill="#050508" />

    <!-- Teacup foot / base -->
    <path d="M -17 43 C -21 51, -13 56, 0 56 C 13 56, 21 51, 17 43" stroke-width="2" />
    <line x1="-24" y1="48" x2="-16" y2="48" stroke-width="1.8" />
    <line x1="16" y1="48" x2="24" y2="48" stroke-width="1.8" />

    <!-- 01 in base -->
    <text x="0" y="54" fill="#ff1a2a" font-family="'JetBrains Mono', 'Courier New', monospace" font-weight="bold" font-size="12" text-anchor="middle" stroke="none">01</text>

    <!-- Handle on right with keyhole -->
    <path d="M 53 -32 C 80 -26, 88 -4, 78 15 C 70 29, 51 26, 44 19" stroke-width="3" />
    <path d="M 52 -22 C 68 -19, 74 -4, 66 10 C 61 19, 50 17, 46 11" stroke-width="1.8" />
    <circle cx="64" cy="-5" r="2.2" fill="#ff1a2a" stroke="none" />
    <polygon points="62.5,-4 65.5,-4 66.5,4 61.5,4" fill="#ff1a2a" stroke="none" />

    <!-- Left cup accent -->
    <path d="M -45 -21 C -46 -14, -43 -7, -42 -2" stroke-width="1.8" />
    <circle cx="-40" cy="6" r="1.5" fill="#ff1a2a" stroke="none" />

    <!-- Smiling Mouth -->
    <path d="M -36 -11 C -21 20, 21 20, 36 -11" stroke-width="2.8" fill="#050508" />
    <path d="M -36 -11 C -21 13, 21 13, 36 -11" stroke-width="2.2" fill="#050508" />

    <!-- Teeth vertical lines -->
    <line x1="-25" y1="-3" x2="-25" y2="5" stroke-width="1.8" />
    <line x1="-15" y1="-0.5" x2="-15" y2="12" stroke-width="1.8" />
    <line x1="-5" y1="1" x2="-5" y2="15" stroke-width="1.8" />
    <line x1="5" y1="1" x2="5" y2="15" stroke-width="1.8" />
    <line x1="15" y1="-0.5" x2="15" y2="12" stroke-width="1.8" />
    <line x1="25" y1="-3" x2="25" y2="5" stroke-width="1.8" />

    <!-- Nose -->
    <path d="M -7.5 -17 L 7.5 -17 L 0 -11 Z" stroke-width="2.2" stroke-linejoin="round" />
  </g>

  <!-- Monospace // portfolio 2026 -->
  <text 
    x="250" 
    y="322" 
    fill="#ff1a2a" 
    font-family="'JetBrains Mono', 'Courier New', monospace" 
    font-weight="700" 
    font-size="14" 
    letter-spacing="3" 
    text-anchor="middle"
  >
    // portfolio 2026
  </text>
</svg>
